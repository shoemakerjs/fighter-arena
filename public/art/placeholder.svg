<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Stand-in key art for champions without a painting yet: a dark backdrop and a hooded silhouette. -->
  <defs>
    <radialGradient id="bg" cx="0.66" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#2f3442"/>
      <stop offset="0.55" stop-color="#16181f"/>
      <stop offset="1" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454c5c"/>
      <stop offset="1" stop-color="#1c1f27"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g fill="url(#fig)" stroke="#7cc7ff" stroke-opacity="0.25" stroke-width="3">
    <!-- hood -->
    <path d="M1250 150 C1180 150 1158 220 1160 280 C1168 340 1210 372 1250 372 C1290 372 1332 340 1340 280 C1342 220 1320 150 1250 150 Z"/>
    <!-- body and cloak -->
    <path d="M1180 362 C1112 392 1088 470 1082 560 L1050 1080 L1450 1080 L1418 560 C1412 470 1388 392 1320 362 C1294 384 1206 384 1180 362 Z"/>
  </g>
  <!-- question mark where a face would be -->
  <text x="1250" y="300" text-anchor="middle" font-family="sans-serif" font-size="110" font-weight="700" fill="#7cc7ff" fill-opacity="0.35">?</text>
</svg>
