<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2311151f' stroke='%233be8c8' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff4f6d'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="world"></canvas>
    <canvas id="hud"></canvas>

    <!-- Home: pick a mode -->
    <div id="home" class="screen">
      <header class="topbar">
        <svg class="topbar-shape" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true">
          <path d="M622.998 0C614.83 11.045 610 24.7083 610 39.5C610 54.7413 615.128 68.7847 623.752 80H0V0H622.998ZM1440 80H817.248C825.872 68.7847 831 54.7413 831 39.5C831 24.7083 826.17 11.045 818.002 0H1440V80Z" />
        </svg>
        <span class="logo">Arena</span>
      </header>
      <p class="toast hidden" id="menu-note"></p>
      <div class="modes">
        <button class="mode-card rough" id="play-online">
          <img class="mode-art" src="./art/mode-pvp.webp" alt="" />
          <span class="mode-copy">
            <span class="mode-title">Play vs Players</span>
            <span class="mode-desc">Invite your friends, face each other in deadly battle</span>
          </span>
          <span class="tag">1v1</span>
        </button>
        <button class="mode-card rough" id="play">
          <img class="mode-art" src="./art/mode-bot.webp" alt="" />
          <span class="mode-copy">
            <span class="mode-title">Play vs Bot</span>
            <span class="mode-desc">Test champions and train your abilities with AI</span>
          </span>
          <span class="tag">1v1</span>
        </button>
      </div>
    </div>

    <!-- Online: invite a friend -->
    <div id="invite" class="screen hidden">
      <div class="invite-card rough">
        <p class="kicker">Play vs Players</p>
        <h2 class="display" id="invite-title">Invite a friend</h2>
        <p class="body-text" id="invite-status"></p>
        <div class="share hidden" id="invite-share">
          <input id="invite-link" readonly />
          <button class="pill" id="invite-copy">Copy</button>
        </div>
        <button class="link-btn" id="invite-leave">Back</button>
      </div>
    </div>

    <!-- Champion select (vs bot and online) -->
    <div id="select" class="screen hidden">
      <div class="select-art" id="select-art"></div>
      <div class="select-shade"></div>
      <div class="select-grunge"></div>
      <button class="link-btn select-back" id="select-back">Back</button>
      <div class="select-left">
        <h1 class="display select-title">Select your character</h1>
        <div class="roster" id="roster"></div>
      </div>
      <section class="champ-info" id="champ-info"></section>
      <footer class="select-bar">
        <div class="enemy">
          <span class="body-text">Enemy team</span>
          <span class="status-chip" id="enemy-status"></span>
        </div>
        <div class="lock">
          <span class="display timer" id="select-timer">30s</span>
          <button class="pill pill-lg" id="lock-in">Lock in</button>
        </div>
      </footer>
    </div>

    <!-- Vs bot: settings after locking in a champion -->
    <div id="bot-setup" class="screen hidden">
      <div class="setup-wrap">
        <div class="setup-card rough">
          <div class="setup-copy">
            <h2 class="display">Bot settings</h2>
            <p class="body-text">Setup your bot settings and start a match</p>
          </div>
          <div class="field">
            <span class="field-label">Bot champion</span>
            <div id="bot-champ"></div>
          </div>
          <div class="field">
            <span class="field-label">Bot difficulty</span>
            <div id="bot-difficulty"></div>
          </div>
        </div>
        <button class="pill pill-lg" id="start-matchup">Start matchup</button>
        <button class="link-btn" id="setup-back">Back</button>
      </div>
    </div>

    <div id="pause" class="screen dim hidden">
      <div class="dialog rough">
        <h2 class="display">Paused</h2>
        <button class="pill pill-lg" id="resume">Resume</button>
        <button class="link-btn" id="quit">Leave match</button>
      </div>
    </div>

    <div id="end" class="screen dim hidden">
      <div class="dialog rough">
        <p class="kicker">Match over</p>
        <h2 class="display" id="end-title">Victory</h2>
        <p class="display score" id="end-score">3 : 1</p>
        <button class="pill pill-lg" id="rematch">Rematch</button>
        <button class="link-btn" id="to-menu">Menu</button>
      </div>
    </div>

    <div id="hint-bar" class="hidden">Esc — pause · M — sound: <span id="sound-state">on</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
