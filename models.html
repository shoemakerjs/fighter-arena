<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #07090d;
        --card: #0e121a;
        --line: #1d2433;
        --text: #e6ebf5;
        --muted: #7d8aa5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 'Prompt', system-ui, sans-serif;
      }
      /* One WebGL canvas over the page; each card's view is drawn into its own rectangle. */
      #view { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px 24px;
        padding: 24px 24px 8px;
      }
      h1 { margin: 0; font: 40px/1 'Pirata One', serif; letter-spacing: 0.02em; }
      h2 { margin: 0; padding: 24px 24px 0; font: 28px/1 'Pirata One', serif; letter-spacing: 0.02em; }
      h2 small { font: 13px 'Prompt', system-ui, sans-serif; color: var(--muted); margin-left: 10px; }
      header p { margin: 0; color: var(--muted); flex: 1; min-width: 240px; }
      .team { display: flex; gap: 6px; }
      .team button {
        font: inherit;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 12px 4px 8px;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      .team button[aria-pressed='true'] { border-color: var(--text); }
      .team i { width: 12px; height: 12px; border-radius: 50%; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
        padding: 16px 24px 8px;
      }
      figure {
        margin: 0;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      figure.wide { grid-column: 1 / -1; }
      .model { aspect-ratio: 4 / 5; cursor: grab; }
      figure.wide .model { aspect-ratio: 16 / 7; }
      figcaption { padding: 10px 14px 12px; border-top: 1px solid var(--line); }
      figcaption b { display: block; font-weight: 600; }
      figcaption span { color: var(--muted); font-size: 12px; }
      @media (max-width: 640px) {
        header, h2, .grid { padding-left: 16px; padding-right: 16px; }
        figure.wide .model { aspect-ratio: 4 / 3; }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <header>
      <h1>Model Gallery</h1>
      <p>Every procedural model from <code>src/render</code>. Drag to orbit, scroll to zoom.</p>
      <div class="team" id="team"></div>
    </header>
    <main id="sections"></main>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
